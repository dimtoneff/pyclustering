name: Build, Test, and Release PyClustering Wheels

on:
  workflow_dispatch:   # Manual trigger
  push:
    tags:
      - 'v*'

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} for Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Checkout our fork
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install system dependencies
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Run CMake verification (Linux only for speed)
      - name: Run CMake test build (Linux only)
        if: runner.os == 'Linux'
        run: |
          chmod u+x ci/github-ci.sh
          ./ci/github-ci.sh TEST_CMAKE_PYCLUSTERING_BUILD

      - name: Build CCORE library
        shell: bash
        run: |
          cd ccore
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S . -B build
            cmake --build build --config Release
          else
            make ccore_64bit
          fi
          cd ..

      - name: Build Python wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py bdist_wheel

      - name: Rename wheel for release
        shell: bash
        run: |
          VERSION="0.10.1.4"
          # Map GitHub runner OS to wheel platform tag
          OS_NAME="${{ matrix.os }}"
          if [ "$OS_NAME" = "ubuntu-latest" ]; then OS_TAG="manylinux_2_28_x86_64"; fi
          if [ "$OS_NAME" = "windows-latest" ]; then OS_TAG="win_amd64"; fi
          if [ "$OS_NAME" = "macos-latest" ]; then OS_TAG="macosx_11_0_x86_64"; fi

          # Map Python version to CP tag for wheel
          PY_VER="${{ matrix.python-version }}"
          if [ "$PY_VER" = "3.10" ]; then PY_TAG="cp310"; fi
          if [ "$PY_VER" = "3.11" ]; then PY_TAG="cp311"; fi
          if [ "$PY_VER" = "3.12" ]; then PY_TAG="cp312"; fi

          # Rename all wheels in dist/
          for whl in dist/*.whl; do
            base_whl=$(basename "$whl")
            mv "$whl" "dist/pyclustering-${VERSION}-${PY_TAG}-none-${OS_TAG}.whl"
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyclustering-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  release:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts (v4)
        uses: actions/download-artifact@v4
        with:
          path: dist_all

      - name: Unzip downloaded artifacts
        run: |
          find dist_all -name "*.zip" -exec unzip -o {} -d dist_all/ \;

      - name: Flatten wheels for release
        run: |
            mkdir -p release_wheels
            # Copy all .whl files from any artifact dist folder
            find dist_all -type f -name "*.whl" -exec cp {} release_wheels/ \;

      #   with:
      #     tag_name: ${{ github.ref_name }}
      #     name: "PyClustering Wheels ${{ github.ref_name }}"
      
      - name: Upload wheels to GitHub Release (fixed tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "0.10.1.4"
          name: "PyClustering Prebuilt Wheels 0.10.1."
          body: |
            Prebuilt PyClustering wheels for:
              - Python 3.10, 3.11, 3.12
              - Linux, macOS, Windows

              These include the compiled CCORE library.
          files: release_wheels/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
