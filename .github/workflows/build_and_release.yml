name: Build, Test, and Release PyClustering Wheels

on:
  workflow_dispatch:   # Trigger manually
  push:
    tags:
      - 'v*'           # Also trigger on tag pushes (like v0.10.2)

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} for Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.10, 3.11, 3.12]

    steps:
      # 1. Checkout our fork
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install build tools
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 4. Build and test C++ CCORE with CMake (like original CI)
      - name: Run official CMake test build
        if: runner.os == 'Linux'  # CMake tests only run on Linux for speed
        run: |
          chmod u+x ci/github-ci.sh
          ./ci/github-ci.sh TEST_CMAKE_PYCLUSTERING_BUILD

      # 5. Build CCORE (for wheel packaging)
      - name: Build CCORE library
        shell: bash
        run: |
          cd ccore
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S . -B build
            cmake --build build --config Release
          else
            make ccore_64bit
          fi
          cd ..

      # 6. Build Python wheel
      - name: Build Python wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py bdist_wheel

      # 7. Upload wheel artifact
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v3
        with:
          name: pyclustering-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  # 8. Gather wheels and publish a GitHub release
  release:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v3
        with:
          path: dist_all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "PyClustering Wheels ${{ github.ref_name }}"
          body: |
            Prebuilt PyClustering wheels for:
            - Python 3.10, 3.11, 3.12
            - Linux, macOS, Windows

            These wheels include the compiled CCORE library.
          files: dist_all/**/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
