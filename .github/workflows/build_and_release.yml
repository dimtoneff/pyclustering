name: Build, Test, and Release PyClustering Wheels

on:
  workflow_dispatch:   # Manual trigger
  push:
    tags:
      - 'v*'           # Also trigger on tag pushes (e.g. v0.10.2)

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} for Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      # 1. Checkout our fork
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install system dependencies
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-dev

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 4. Run CMake verification (Linux only for speed)
      - name: Run CMake test build (Linux only)
        if: runner.os == 'Linux'
        run: |
          chmod u+x ci/github-ci.sh
          ./ci/github-ci.sh TEST_CMAKE_PYCLUSTERING_BUILD

      # 5. Build C core (CMake or Make)
      - name: Build CCORE library
        shell: bash
        run: |
          cd ccore
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake -S . -B build
            cmake --build build --config Release
          else
            make ccore_64bit
          fi
          cd ..

      # 6. Build wheel
      - name: Build Python wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py bdist_wheel

      # 7. Upload wheel artifact (v4)
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyclustering-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  release:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts (v4)
        uses: actions/download-artifact@v4
        with:
          path: dist_all

      # - name: Create GitHub Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: ${{ github.ref_name }}
      #     name: "PyClustering Wheels ${{ github.ref_name }}"
      #     body: |
      #       Prebuilt PyClustering wheels for:
      #       - Python 3.10, 3.11, 3.12
      #       - Linux, macOS, Windows

      #       These include the compiled CCORE library.
      #     files: dist_all/**/*.whl
      - name: Upload wheels to GitHub Release (fixed tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "0.10.1.3"
          name: "PyClustering Prebuilt Wheels 0.10.1.3"
          files: dist/**/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
